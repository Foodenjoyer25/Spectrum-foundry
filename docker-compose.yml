services:
  spectrum-foundry:
    build: .
    image: spectrum-foundry
    ports:
      - "8080:8080"
    environment:
      MAX_UPLOAD_MB: "500"
      MAX_CONCURRENT_JOBS: "1"
      JOB_TTL_MINUTES: "60"
      # MAX_DURATION_SECONDS: "900"
      # ALLOW_4K: "false"
      # X264_PRESET: "veryfast"
    volumes:
      - spectrum-data:/data
    restart: unless-stopped

volumes:
  spectrum-data:
